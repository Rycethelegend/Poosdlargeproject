name: Frontend Preview Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-frontend:
    if: github.ref_name == 'Frontend-Testing'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Transfer frontend build
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          REMOTE_ARCHIVE: /tmp/frontend-preview-${{ github.run_id }}.tar.gz
        run: |
          tar -czf frontend-dist.tar.gz -C frontend/dist .
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o BatchMode=yes \
            frontend-dist.tar.gz "${SSH_USERNAME}@${SSH_HOST}:${REMOTE_ARCHIVE}"

      - name: Publish frontend files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          REMOTE_ARCHIVE: /tmp/frontend-preview-${{ github.run_id }}.tar.gz
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o BatchMode=yes \
            "${SSH_USERNAME}@${SSH_HOST}" \
            "set -e; stage_dir=\$(mktemp -d); trap 'rm -rf \"\$stage_dir\" \"$REMOTE_ARCHIVE\"' EXIT; tar -xzf \"$REMOTE_ARCHIVE\" -C \"\$stage_dir\"; rm -rf /var/www/html/*; cp -a \"\$stage_dir\"/. /var/www/html/"
